version: "2"

run:
  timeout: 5m

linters:
  # The v2.14 "defaults: use-standard" key was removed in v2.15; enable the
  # standard set explicitly so the config validates on both.
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

formatters:
  enable:
    - gofmt
